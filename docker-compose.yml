services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: sig-laravel-app

    working_dir: /var/www

    volumes:
      - ./:/var/www

    depends_on:
      - mysql

  nginx:

    image: nginx:latest

    container_name: sig-nginx

    ports:
      - "8000:80"

    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

  mysql:

    image: mysql:8.0

    container_name: sig-mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sig_bencana
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: sig-phpmyadmin

    depends_on:
      - mysql

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306

    ports:
      - "8080:80"

  node:

    image: node:22

    container_name: sig-node

    working_dir: /var/www

    volumes:
      - ./:/var/www

    tty: true

volumes:

  mysql_data: